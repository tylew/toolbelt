services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME}
    ports:
      # SOCKS5 + HTTP proxy for reaching tailnet devices through this node.
      # Bound to localhost only — do not expose the unauthenticated proxy to the LAN.
      - "127.0.0.1:1055:1055"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_DEST_IP=0.250.250.254
      # Expose a SOCKS5 + HTTP CONNECT proxy so the host can dial tailnet devices through this node.
      - TS_TAILSCALED_EXTRA_ARGS=--socks5-server=0.0.0.0:1055 --outbound-http-proxy-listen=0.0.0.0:1055
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

volumes:
  tailscale-state:
