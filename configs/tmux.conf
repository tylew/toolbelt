# tmux config — symlinked to ~/.config/tmux/tmux.conf by install.sh --tmux.
# Edit here; reload a running session with prefix + r (or: tmux source-file …).
# Prefix stays the default C-b.

# ── Display ──
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough
set -g mouse on                              # scroll, select, resize with the mouse

# ── Behavior ──
set -g history-limit 50000                   # deeper scrollback
set -sg escape-time 10                       # snappier ESC (matters for vim/nvim)
set -g base-index 1                          # windows start at 1…
setw -g pane-base-index 1                    # …and so do panes
set -g renumber-windows on                   # keep numbering gap-free after closing

# ── Splits & new windows keep the current path ──
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ── vi-style copy mode ──
setw -g mode-keys vi

# ── Reload config ──
bind r source-file "${HOME}/.config/tmux/tmux.conf" \; display "tmux.conf reloaded"
